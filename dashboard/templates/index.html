<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponto do Tempero</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }

body {
    background: radial-gradient(ellipse at top left, #c8e6c0, #a8d5a0 40%, #7cbd72 100%);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
}

/* Círculos decorativos de fundo */
body::before {
    content:'';
    position:absolute;
    width:500px; height:500px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    top:-150px; left:-150px;
    pointer-events:none;
}
body::after {
    content:'';
    position:absolute;
    width:400px; height:400px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    bottom:-100px; right:-100px;
    pointer-events:none;
}

/* Faixa branca central */
.faixa {
    position:absolute;
    top:50%; left:0;
    width:100%; height:110px;
    background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0.92),
        rgba(255,255,255,0)
    );
    transform:translateY(-50%);
    pointer-events:none;
}

/* HEADER com menu */
.header {
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding: 28px 60px;
    position:relative;
    z-index:10;
}

.menu {
    display:flex;
    gap:12px;
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(8px);
    padding:10px 20px;
    border-radius:50px;
    border:1px solid rgba(255,255,255,0.5);
    box-shadow:0 4px 24px rgba(0,0,0,0.08);
}

.menu button {
    padding: 10px 22px;
    border:none;
    border-radius:30px;
    background:transparent;
    color:#2d5a1f;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.5px;
    cursor:pointer;
    transition: all 0.25s ease;
    position:relative;
}

.menu button:hover {
    background:#5a8a4a;
    color:#fff;
    box-shadow:0 4px 14px rgba(90,138,74,0.4);
    transform:translateY(-1px);
}

.menu button.active {
    background:#3d7a2a;
    color:#fff;
}

/* LOGO central */
.logo {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
    text-align:center;
}

.logo-container {
    width:280px; height:280px;
    border-radius:50%;
    overflow:hidden;
    border:5px solid rgba(255,255,255,0.8);
    box-shadow:
        0 0 0 10px rgba(255,255,255,0.25),
        0 20px 60px rgba(0,0,0,0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.logo-container:hover {
    transform:scale(1.04);
    box-shadow:
        0 0 0 10px rgba(255,255,255,0.3),
        0 28px 70px rgba(0,0,0,0.25);
}

.logo-container img {
    width:100%; height:100%;
    object-fit:cover;
}

.logo-title {
    margin-top:18px;
    font-size:22px;
    font-weight:700;
    color:#2d5a1f;
    letter-spacing:1.5px;
    text-shadow:0 1px 3px rgba(255,255,255,0.6);
    text-transform:uppercase;
}

/* RODAPÉ com usuário */
.usuario {
    position:absolute;
    bottom:40px; left:36px;
    display:flex;
    align-items:center;
    gap:14px;
    background:rgba(255,255,255,0.3);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:50px;
    padding:10px 20px 10px 12px;
    box-shadow:0 4px 20px rgba(0,0,0,0.1);
}

.avatar {
    width:48px; height:48px;
    border-radius:50%;
    background:linear-gradient(135deg,#5a8a4a,#3d7a2a);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:18px;
    color:#fff;
    box-shadow:0 3px 10px rgba(61,122,42,0.4);
    flex-shrink:0;
}

.info-usuario {
    display:flex;
    flex-direction:column;
}

.nome {
    color:#2d5a1f;
    font-size:16px;
    font-weight:700;
    line-height:1.2;
}

.cargo {
    color:#5a8a4a;
    font-size:12px;
    font-weight:500;
}

.btn-sair {
    margin-left:6px;
    text-decoration:none;
    background:#5a8a4a;
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:8px 16px;
    border-radius:30px;
    transition:background 0.2s;
}
.btn-sair:hover { background:#3d7a2a; }

/* INFO cantos */
.info-corner {
    position:absolute;
    bottom:40px; right:36px;
    display:flex;
    gap:16px;
}

.info-card {
    background:rgba(255,255,255,0.3);
    backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:16px;
    padding:12px 20px;
    text-align:center;
    box-shadow:0 4px 16px rgba(0,0,0,0.08);
}

.info-card span {
    display:block;
    color:#2d5a1f;
    font-size:20px;
    font-weight:700;
}

.info-card small {
    color:#5a8a4a;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.5px;
    text-transform:uppercase;
}
</style>
</head>
