{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Ponto do Tempero</title>
<link rel="icon" href="{% static 'img/logo.jpg' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Cormorant+Garamond:wght@500&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<script>
(function(){var k='ptt-theme',r=document.documentElement,s=localStorage.getItem(k);
r.setAttribute('data-theme', s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));})();
</script>
<style>
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --text:#1A2A22; --muted:#6B7A72; --faint:#9AA69E;
  --emerald:#2E5E4E; --emerald-light:#3A7A66; --emerald-dark:#1E3E34;
  --gold:#D4AF37; --gold-light:#E8CC6E; --border:#E2E8DF; --shadow:0 30px 80px rgba(30,62,52,.14);
  --err-bg:rgba(178,58,44,.1);--err-bd:rgba(178,58,44,.4);--err-fg:#a02c30;
}
:root[data-theme="dark"]{
  --bg:#0E1A15; --surface:#17281F; --text:#EEF3E9; --muted:#9DACA1; --faint:#6C7A70;
  --emerald:#4C9179; --emerald-light:#61A98E; --emerald-dark:#0A130F;
  --border:#243A2E; --shadow:0 30px 80px rgba(0,0,0,.5);
  --err-bg:rgba(224,108,94,.14);--err-bd:rgba(224,108,94,.5);--err-fg:#F0A497;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Lato',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;transition:background .4s,color .4s;
  background-image:radial-gradient(circle at 15% 20%,rgba(46,94,78,.10),transparent 40%),radial-gradient(circle at 85% 80%,rgba(212,175,55,.10),transparent 40%)}
.card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.top{background:linear-gradient(150deg,var(--emerald),var(--emerald-dark));padding:40px 40px 34px;text-align:center;position:relative}
.top::after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-light))}
.top img{width:92px;height:92px;border-radius:22px;object-fit:cover;border:2px solid rgba(212,175,55,.6);box-shadow:0 12px 30px rgba(0,0,0,.3)}
.top h1{font-family:'Playfair Display',serif;color:#fff;font-weight:500;font-size:1.5rem;margin-top:18px}
.top p{font-family:'Cormorant Garamond',serif;color:var(--gold-light);font-size:.95rem;letter-spacing:.2em;text-transform:uppercase;margin-top:4px}
.body{padding:36px 40px 40px}
.body h2{font-size:.78rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:26px;text-align:center}
.error{background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err-fg);border-radius:12px;padding:12px 16px;font-size:.88rem;text-align:center;margin-bottom:22px}
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--emerald);margin:0 0 7px 2px}
:root[data-theme="dark"] label{color:var(--gold-light)}
.field{margin-bottom:20px}
input[type=text],input[type=password]{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:'Lato';font-size:.95rem;transition:.25s}
input:focus{outline:none;border-color:var(--gold);background:var(--surface);box-shadow:0 0 0 4px rgba(212,175,55,.16)}
.row{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 26px;font-size:.85rem;color:var(--muted)}
.row a{color:var(--emerald);text-decoration:none;font-weight:700}
:root[data-theme="dark"] .row a{color:var(--gold-light)}
.row label{display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);margin:0}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:var(--emerald);color:#fff;font-family:'Lato';font-weight:900;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:.3s}
.btn:hover{background:var(--emerald-light);box-shadow:0 10px 26px rgba(46,94,78,.35);transform:translateY(-2px)}
.foot{text-align:center;margin-top:24px;font-size:.8rem;color:var(--faint)}
.theme-toggle{position:fixed;top:22px;right:22px;z-index:50;width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:1.1rem;box-shadow:0 6px 20px rgba(0,0,0,.12);transition:.3s}
.theme-toggle:hover{border-color:var(--gold)}
</style>
</head>
<body>
<button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" aria-label="Alternar tema">☾</button>

<div class="card">
  <div class="top">
    <img src="{% static 'img/logo.jpg' %}" alt="Ponto do Tempero">
    <h1>Ponto do Tempero</h1>
    <p>Mercado Municipal</p>
  </div>
  <div class="body">
    <h2>Sistema de Gestão de Estoque</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="field"><label for="usuario">Usuário</label><input type="text" id="usuario" name="usuario" placeholder="seu.usuario" value="{{ usuario|default:'' }}" autofocus></div>
      <div class="field"><label for="senha">Senha</label><input type="password" id="senha" name="senha" placeholder="••••••••"></div>
      <div class="row">
        <label><input type="checkbox" name="lembrar"> Lembrar-me</label>
        <a href="#">Esqueci a senha</a>
      </div>
      <button class="btn" type="submit">Acessar painel</button>
    </form>
    <p class="foot">© Ponto do Tempero · Taubaté</p>
  </div>
</div>

<script>
function toggleTheme(){var r=document.documentElement,c=r.getAttribute('data-theme')==='dark'?'light':'dark';
r.setAttribute('data-theme',c);localStorage.setItem('ptt-theme',c);document.getElementById('themeBtn').textContent=c==='dark'?'☀︎':'☾';}
document.getElementById('themeBtn').textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀︎':'☾';
</script>
</body>
</html>
