<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponto do Tempero - Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #b5ceaa;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }
  .logo-box {
    width: 220px;
    height: 220px;
    border-radius: 12px;
    overflow: hidden;
    border: 3px solid #5a8a4a;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .logo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .login-card {
    background: #d4e8c8;
    border: 1px solid #7aad6e;
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }
  .login-title {
    font-size: 20px;
    font-weight: 600;
    color: #2d5a1f;
    text-align: center;
    margin-bottom: 24px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }
  .form-group label {
    font-size: 13px;
    font-weight: 600;
    color: #2d5a1f;
  }
  .form-group input {
    background: #e8f4de;
    border: 1.5px solid #7aad6e;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    color: #2d5a1f;
    font-family: inherit;
    transition: border-color 0.2s;
    outline: none;
  }
  .form-group input::placeholder { color: #8ab87a; }
  .form-group input:focus { border-color: #3d7a2a; background: #f0f9e8; }
  .remember-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .remember-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #2d5a1f;
    cursor: pointer;
  }
  .remember-row input[type="checkbox"] { accent-color: #5a8a4a; }
  .remember-row a {
    color: #3d7a2a;
    text-decoration: none;
    font-weight: 500;
  }
  .btn-login {
    width: 100%;
    background: #5a8a4a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }
  .btn-login:hover { background: #3d7a2a; }
  .footer-user {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #c8deba;
    border-radius: 50px;
    padding: 8px 16px;
    border: 1px solid #7aad6e;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #5a8a4a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
  }
  .user-label {
    font-size: 14px;
    font-weight: 600;
    color: #2d5a1f;
  }
</style>
</head>
