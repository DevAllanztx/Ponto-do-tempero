<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponto do Tempero</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#d7e7d1;
    overflow:hidden;
}

/* Faixa branca horizontal */
.faixa{
    position:absolute;
    top:50%;
    left:0;
    width:100%;
    height:90px;

    background:linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0.95),
        rgba(255,255,255,0)
    );

    transform:translateY(-50%);
}

/* Menu */
.menu{
    width:100%;
    display:flex;
    justify-content:center;
    gap:35px;
    margin-top:70px;
    position:relative;
    z-index:2;
}

.menu button{
    width:130px;
    height:45px;

    border:none;
    border-radius:5px;

    background:#8ac67f;

    color:#3f6b2c;
    font-weight:bold;
    font-size:15px;

    cursor:pointer;
}

/* Logo */
.logo{
    position:absolute;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);
    z-index:2;
}

.logo img{
    width:320px;
}

/* Perfil */
.usuario{
    position:absolute;
    bottom:55px;
    left:30px;

    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:56px;
    height:56px;

    border-radius:50%;
    background:#28b446;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
    font-size:22px;
}

.nome{
    color:#355626;
    font-size:32px;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="faixa"></div>

<div class="menu">
    <button>HOME</button>
    <button>PRODUTOS</button>
    <button>MOVIMENTAÇÕES</button>
    <button>RELATÓRIOS</button>
    <button>CONTATOS</button>
</div>

{% load static %}

<div class="logo">
    <img src="{% static 'img/logo.jpg' %}" alt="Ponto do Tempero">
</div>

<div class="usuario">
    <div class="avatar">AD</div>
    <div class="nome">Adm</div>
</div>

</body>
</html>
